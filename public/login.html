<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות למערכת</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        button:hover { opacity: 0.9; }
        .error { color: red; margin-top: 10px; font-size: 0.9em; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>👋 שלום!</h2>
        <p>נא להתחבר לממשק הניהול</p>
        <form onsubmit="event.preventDefault(); doLogin();">
            <input type="text" id="username" placeholder="שם משתמש" required>
            <input type="password" id="password" placeholder="סיסמה" required>
            <button type="submit">כניסה</button>
            <div id="errorMsg" class="error">שם משתמש או סיסמה שגויים</div>
        </form>
    </div>

    <script>
        async function doLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    if (data.role === 'SUPER_ADMIN') {
                        window.location.href = 'index.html'; // מנהל-על עובר למסך כל העסקים
                    } else {
                        window.location.href = 'manage.html'; // בעל עסק עובר לניהול העסק שלו
                    }
                } else {
                    err.style.display = 'block';
                    err.innerText = data.message || 'שגיאה בהתחברות';
                }
            } catch (e) {
                err.style.display = 'block';
                err.innerText = 'תקלת תקשורת';
            }
        }
    </script>
</body>
</html>
